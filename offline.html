<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060908">
  <title>You're Offline | MUNAISZN PLAY</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #060908;
      color: #f3f7f4;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 460px; }
    .brand {
      color: #d4b16a;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 5px;
      margin-bottom: 45px;
    }
    .symbol {
      font-size: 54px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(30px, 8vw, 44px);
      margin: 0 0 16px;
      letter-spacing: -1px;
    }
    p {
      color: #a2b2aa;
      line-height: 1.7;
      font-size: 16px;
    }
    button {
      margin-top: 22px;
      padding: 14px 25px;
      border: 1px solid #d4b16a;
      border-radius: 8px;
      background: transparent;
      color: #f3f7f4;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: scale(.97); }
    .note {
      margin-top: 28px;
      font-size: 12px;
      color: #718078;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">MUNAISZN PLAY</div>
    <div class="symbol">◈</div>
    <h1>You're offline.</h1>
    <p>Your connection seems to be unavailable right now. Reconnect to the internet to discover movies and series again.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <p class="note">Your cinematic experience will be waiting.</p>
  </main>
</body>
</html>
